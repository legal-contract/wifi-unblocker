<!DOCTYPE html>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
        }

        /* Fullscreen front page (terms gate) */
        #terms-screen {
            position: fixed;
            inset: 0;
            background: #000000;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            z-index: 999;
        }

        #terms-box {
            max-width: 800px;
            width: 100%;
            background: #323232;
            border-radius: 0px;
            padding: 24px;
            box-shadow: 0 0 20px rgba(0,0,0,0.6);
        }

        #terms-title {
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 16px;
            text-align: center;
        }

        #terms-text {
            width: 100%;
            height: 260px;
            resize: none;
            border-radius: 0px;
            border: 1px solid #000000;
            padding: 10px;
            background: #4c4c4c;
            color: #000000;
            font-size: 0.9rem;
        }

        #agree-container {
            margin-top: 18px;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        button {
            padding: 10px 18px;
            border-radius: 0px;
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
        }

        #agree-btn {
            background: #000000;
            color: #ffffff;
            font-weight: bold;
        }

        #cancel-btn {
            background: #000000;
            color: #ffffff;
        }

        /* Second page content */
        #main-content {
            width: 100%;
            height: 100%;
            padding: 20px;
            background: #000000;
        }

        #giant-textbox {
            width: 100%;
            height: calc(100vh - 40px);
            resize: none;
            font-size: 1rem;
            padding: 0px;
        }
    </style>
</head>

01
Install Docker Desktop
Docker Desktop is required to create the local network environment Roblox will use.

Windows: Download from docker.com/products/docker-desktop
macOS: Download from docker.com/products/docker-desktop

Open the installer

Accept all prompts

Restart your computer if asked

02
Start Docker Desktop
Docker must be running before you can create the network Roblox will use.

Open Docker Desktop from the Start Menu (Windows) or Applications folder (macOS)

Wait until the status shows "Running"

03
Create a Local Proxy Container
This container will act as the connection point Roblox uses.

In Docker Desktop, open the Terminal

Type: docker run -d --name localproxy -p 8080:8080 alpine/socat tcp-listen:8080,fork tcp:roblox.com:443

Press Enter

Wait for the container to show as "Running"

04
Configure Roblox to Use the Local Proxy
Roblox will send its connection through the Docker container.

Windows: Use Proxifier
macOS: Use Proxifier for Mac

Install Proxifier from proxifier.com

Open Proxifier

Add a new proxy server: Address 127.0.0.1, Port 8080

Create a rule: Apply the proxy to RobloxPlayerBeta.exe

05
Launch Roblox
Roblox will now run through the local proxy you created.

Open Roblox normally

Roblox will connect through the Docker container

If Roblox opens and loads, the setup is working

            *WARNING*
If any of the following are at any point true, immediately uninstall desktop docker and restart your PC.
            The port becomes 0.0.0.0
            You see the codes CVE-2025-9074 or CVE-2025-9164
            The socket /var/run/docker.sock is mounted
            --privileged is entered without your permission
