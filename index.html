<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Terms & Access Gate</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
        }

        /* Fullscreen front page (terms gate) */
        #terms-screen {
            position: fixed;
            inset: 0;
            background: #0b0c10;
            color: #c5c6c7;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            z-index: 999;
        }

        #terms-box {
            max-width: 800px;
            width: 100%;
            background: #1f2833;
            border-radius: 8px;
            padding: 24px;
            box-shadow: 0 0 20px rgba(0,0,0,0.6);
        }

        #terms-title {
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 16px;
            text-align: center;
        }

        #terms-text {
            width: 100%;
            height: 260px;
            resize: none;
            border-radius: 6px;
            border: 1px solid #45a29e;
            padding: 10px;
            background: #0b0c10;
            color: #c5c6c7;
            font-size: 0.9rem;
        }

        #agree-container {
            margin-top: 18px;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        button {
            padding: 10px 18px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
        }

        #agree-btn {
            background: #45a29e;
            color: #0b0c10;
            font-weight: bold;
        }

        #cancel-btn {
            background: #c5c6c7;
            color: #0b0c10;
        }

        /* Second page content */
        #main-content {
            width: 100%;
            height: 100%;
            padding: 20px;
            background: #ffffff;
        }

        #giant-textbox {
            width: 100%;
            height: calc(100vh - 40px);
            resize: none;
            font-size: 1rem;
            padding: 10px;
        }
    </style>
</head>
<body>

    <!-- FRONT PAGE: TERMS SCREEN -->
    <div id="terms-screen">
        <div id="terms-box">
            <div id="terms-title">
                NON DISCLOSURE AND GENERAL LIABILITY AND RESPONSIBILITY AND T's + C's AGREEMENT
            </div>
            <textarea id="terms-text" readonly>

            </textarea>

            <div id="agree-container">
                <button id="cancel-btn" onclick="window.close()">Exit</button>
                <button id="agree-btn">Agree</button>
            </div>
        </div>
    </div>

    <!-- SECOND PAGE: MAIN CONTENT WITH GIANT TEXTBOX -->
    <div id="main-content" style="display:none;">
        <textarea id="giant-textbox">
[TEXTBOX]

This is where the instructions will go
        </textarea>
    </div>

    <script>
        const agreeBtn = document.getElementById('agree-btn');
        const termsScreen = document.getElementById('terms-screen');
        const mainContent = document.getElementById('main-content');

        agreeBtn.addEventListener('click', () => {
            // Hide terms screen and show main content
            termsScreen.style.display = 'none';
            mainContent.style.display = 'block';
        });
    </script>

</body>
</html>
